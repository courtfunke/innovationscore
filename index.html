<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIRST LEGO League - Innovation Project Rubric</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0066cc;
      --primary-hover: #0052a3;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      
      --lvl1-bg: #fef2f2; --lvl1-border: #fca5a5;
      --lvl2-bg: #fffbeb; --lvl2-border: #fde68a;
      --lvl3-bg: #f0fdf4; --lvl3-border: #86efac;
      --lvl4-bg: #eff6ff; --lvl4-border: #93c5fd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 1.75rem 2rem;
      border-bottom: 4px solid var(--primary);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #ffffff;
    }
    .brand p {
      color: #94a3b8;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .team-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      padding: 1.5rem 2rem;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .input-group label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }
    .input-group input {
      padding: 0.6rem 0.8rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      transition: all 0.2s;
    }
    .input-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
    }

    /* TIMER SECTION */
    .timer-card {
      background: #1e293b;
      color: white;
      margin: 1.5rem 2rem 0;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .timer-display-container {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .timer-digits {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.25rem;
      font-weight: 700;
      background: #0f172a;
      padding: 0.25rem 1rem;
      border-radius: 8px;
      border: 2px solid #334155;
      color: #38bdf8;
      letter-spacing: 2px;
    }
    .timer-digits.warning {
      color: #fbbf24;
      border-color: #f59e0b;
    }
    .timer-digits.time-up {
      color: #ef4444;
      border-color: #dc2626;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .timer-controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .btn-timer {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-start { background: #22c55e; color: white; }
    .btn-start:hover { background: #16a34a; }
    .btn-pause { background: #eab308; color: white; }
    .btn-pause:hover { background: #ca8a04; }
    .btn-reset { background: #64748b; color: white; }
    .btn-reset:hover { background: #475569; }
    .btn-preset { background: #334155; color: #cbd5e1; }
    .btn-preset:hover { background: #475569; color: white; }

    /* RUBRIC TABLE */
    .rubric-container {
      padding: 1.5rem 2rem;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 1rem;
      border: 1px solid var(--border);
      vertical-align: top;
    }
    th {
      background: #f8fafc;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    .col-criteria { width: 22%; }
    .col-level { width: 17.5%; }
    .col-exceeds { width: 25%; }

    .criteria-title {
      font-weight: 800;
      font-size: 0.95rem;
      color: #0f172a;
    }
    .criteria-desc {
      font-size: 0.825rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
      line-height: 1.4;
    }

    .level-cell {
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .level-cell:hover { background: #f1f5f9; }

    .level-cell.lvl-1.selected { background: var(--lvl1-bg); border-color: var(--lvl1-border); }
    .level-cell.lvl-2.selected { background: var(--lvl2-bg); border-color: var(--lvl2-border); }
    .level-cell.lvl-3.selected { background: var(--lvl3-bg); border-color: var(--lvl3-border); }
    .level-cell.lvl-4.selected { background: var(--lvl4-bg); border-color: var(--lvl4-border); }

    .radio-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
    }
    .radio-wrapper input[type="radio"] {
      margin-top: 0.15rem;
      cursor: pointer;
      width: 16px;
      height: 16px;
    }
    .cell-text {
      font-size: 0.825rem;
      line-height: 1.35;
      color: #334155;
    }

    .exceeds-textarea {
      width: 100%;
      height: 80px;
      padding: 0.5rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.825rem;
      font-family: inherit;
      resize: vertical;
      outline: none;
    }
    .exceeds-textarea:focus {
      border-color: var(--primary);
    }

    .footer-actions {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      border-top: 1px solid var(--border);
    }
    .score-summary {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
    }
    .score-summary span {
      color: var(--primary);
    }
    .btn-submit {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: var(--primary-hover);
    }

    /* PRINT STYLES */
    @media print {
      body { background: white; color: black; padding: 0; }
      .container { box-shadow: none; max-width: 100%; border-radius: 0; }
      .timer-card, .btn-submit, .btn-timer, .timer-controls { display: none !important; }
      th, td { padding: 0.5rem; font-size: 0.8rem; }
      .exceeds-textarea { border: none; height: auto; padding: 0; }
      input[type="text"] { border: none; background: transparent; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <h1>FIRST LEGO LEAGUE</h1>
        <p>Innovation Project Judging Rubric</p>
      </div>
    </header>

    <form id="rubricForm" onsubmit="handleFormSubmit(event)">
      <div class="team-info">
        <div class="input-group">
          <label for="teamNo">Team #</label>
          <input type="text" id="teamNo" required placeholder="e.g. 12345">
        </div>
        <div class="input-group">
          <label for="teamName">Team Name</label>
          <input type="text" id="teamName" required placeholder="e.g. TechnoBots">
        </div>
        <div class="input-group">
          <label for="judgingRoom">Judging Room</label>
          <input type="text" id="judgingRoom" placeholder="e.g. Room A">
        </div>
      </div>

      <!-- TIMER SECTION -->
      <div class="timer-card">
        <div class="timer-display-container">
          <div class="timer-digits" id="timerDisplay">05:00</div>
          <div>
            <div style="font-weight: 700; font-size: 0.9rem;">Presentation Timer</div>
            <div style="font-size: 0.75rem; color: #94a3b8;">5-minute presentation countdown</div>
          </div>
        </div>
        <div class="timer-controls">
          <button type="button" class="btn-timer btn-start" onclick="startTimer()">Start</button>
          <button type="button" class="btn-timer btn-pause" onclick="pauseTimer()">Pause</button>
          <button type="button" class="btn-timer btn-reset" onclick="resetTimer()">Reset</button>
          <button type="button" class="btn-timer btn-preset" onclick="setPreset(300)">5:00</button>
          <button type="button" class="btn-timer btn-preset" onclick="setPreset(180)">3:00</button>
        </div>
      </div>

      <!-- RUBRIC TABLE -->
      <div class="rubric-container">
        <table>
          <thead>
            <tr>
              <th class="col-criteria">Category & Criteria</th>
              <th class="col-level">Beginning (1)</th>
              <th class="col-level">Developing (2)</th>
              <th class="col-level">Accomplished (3)</th>
              <th class="col-level">Exceeds (4)</th>
              <th class="col-exceeds">How has the team exceeded?</th>
            </tr>
          </thead>
          <tbody id="rubricBody">
            <!-- Dynamically Rendered -->
          </tbody>
        </table>
      </div>

      <div class="footer-actions">
        <div class="score-summary">
          Total Score: <span id="totalScore">0 / 20</span>
        </div>
        <button type="submit" class="btn-submit">Submit & Save PDF</button>
      </div>
    </form>
  </div>

  <script>
    const rubricData = [
      {
        id: "identify",
        title: "IDENTIFY",
        desc: "Team had a clearly defined problem that was well researched.",
        l1: "Unclear definition of the problem.<br><br>Minimal evidence of research.",
        l2: "Partially clear definition of the problem.<br><br>Partial evidence of research from one or more sources.",
        l3: "Clear definition of the problem.<br><br>Clear, detailed research from a variety of sources.",
        l4: "Exceeds standard expectations for research and problem identification."
      },
      {
        id: "design",
        title: "DESIGN",
        desc: "Team worked together while creating a project plan and developing their ideas.",
        l1: "Minimal evidence of an effective project plan.<br><br>Minimal evidence that development process involved all team members.",
        l2: "Partial evidence of an effective project plan.<br><br>Partial evidence that development process involved all team members.",
        l3: "Clear evidence of an effective project plan.<br><br>Clear evidence that development process involved all team members.",
        l4: "Exceeds standard expectations for project planning and team collaboration."
      },
      {
        id: "create",
        title: "CREATE",
        desc: "Team developed an original idea or built on an existing one with a prototype model/drawing.",
        l1: "Minimal explanation of innovation in solution.<br><br>Unclear model/drawing that represents the solution.",
        l2: "Simple explanation of innovation in solution.<br><br>Simple model/drawing that represents the solution.",
        l3: "Detailed explanation of innovation in solution.<br><br>Detailed model/drawing that represents the solution.",
        l4: "Exceeds standard expectations for solution innovation and prototyping."
      },
      {
        id: "iterate",
        title: "ITERATE",
        desc: "Team shared their ideas with others, collected feedback, and included improvements.",
        l1: "Minimal sharing of their solution with others.<br><br>Minimal evidence of improvements based on feedback.",
        l2: "Solution shared with at least one person/group.<br><br>Partial evidence of improvements based on feedback.",
        l3: "Solution shared with multiple people/groups.<br><br>Clear evidence of improvements based on feedback.",
        l4: "Exceeds standard expectations for iteration and user feedback collection."
      },
      {
        id: "communicate",
        title: "COMMUNICATE",
        desc: "Team shared an effective presentation of their solution and its impact on others.",
        l1: "Unclear explanation of solution.<br><br>Presentation shows minimal pride or enthusiasm.",
        l2: "Partially clear explanation of solution.<br><br>Presentation shows partial pride or enthusiasm.",
        l3: "Clear explanation of solution and impact.<br><br>Presentation clearly shows pride and enthusiasm.",
        l4: "Exceeds standard expectations for presentation delivery and communication."
      }
    ];

    function renderRubricTable() {
      const tbody = document.getElementById("rubricBody");
      tbody.innerHTML = rubricData.map(item => `
        <tr>
          <td>
            <div class="criteria-title">${item.title}</div>
            <div class="criteria-desc">${item.desc}</div>
          </td>
          <td class="level-cell lvl-1" onclick="selectCell('${item.id}', 1, this)">
            <div class="radio-wrapper">
              <input type="radio" name="${item.id}" value="1" onchange="calculateTotal()">
              <span class="cell-text">${item.l1}</span>
            </div>
          </td>
          <td class="level-cell lvl-2" onclick="selectCell('${item.id}', 2, this)">
            <div class="radio-wrapper">
              <input type="radio" name="${item.id}" value="2" onchange="calculateTotal()">
              <span class="cell-text">${item.l2}</span>
            </div>
          </td>
          <td class="level-cell lvl-3" onclick="selectCell('${item.id}', 3, this)">
            <div class="radio-wrapper">
              <input type="radio" name="${item.id}" value="3" onchange="calculateTotal()">
              <span class="cell-text">${item.l3}</span>
            </div>
          </td>
          <td class="level-cell lvl-4" onclick="selectCell('${item.id}', 4, this)">
            <div class="radio-wrapper">
              <input type="radio" name="${item.id}" value="4" onchange="calculateTotal()">
              <span class="cell-text">${item.l4}</span>
            </div>
          </td>
          <td>
            <textarea id="exceeds_${item.id}" class="exceeds-textarea" placeholder="Required if Level 4 is selected..."></textarea>
          </td>
        </tr>
      `).join('');
    }

    function selectCell(categoryId, value, el) {
      const radio = el.querySelector('input[type="radio"]');
      radio.checked = true;
      
      const parentRow = el.closest('tr');
      parentRow.querySelectorAll('.level-cell').forEach(cell => cell.classList.remove('selected'));
      el.classList.add('selected');
      
      calculateTotal();
    }

    function calculateTotal() {
      let total = 0;
      rubricData.forEach(item => {
        const selected = document.querySelector(`input[name="${item.id}"]:checked`);
        if (selected) total += parseInt(selected.value, 10);
      });
      document.getElementById("totalScore").innerText = `${total} / 20 (${Math.round((total/20)*100)}%)`;
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      window.print();
    }

    // --- Timer Logic ---
    let timerSeconds = 300;
    let timerInterval = null;

    function updateTimerDisplay() {
      const min = Math.floor(timerSeconds / 60);
      const sec = timerSeconds % 60;
      const display = document.getElementById("timerDisplay");
      display.innerText = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
      
      if (timerSeconds <= 60 && timerSeconds > 0) {
        display.className = "timer-digits warning";
      } else if (timerSeconds === 0) {
        display.className = "timer-digits time-up";
      } else {
        display.className = "timer-digits";
      }
    }

    function startTimer() {
      if (timerInterval || timerSeconds <= 0) return;
      timerInterval = setInterval(() => {
        timerSeconds--;
        updateTimerDisplay();
        if (timerSeconds <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          playBeepSound();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function resetTimer() {
      pauseTimer();
      timerSeconds = 300;
      updateTimerDisplay();
    }

    function setPreset(sec) {
      pauseTimer();
      timerSeconds = sec;
      updateTimerDisplay();
    }

    function playBeepSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = 880;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 1);
        osc.stop(ctx.currentTime + 1);
      } catch (e) {}
    }

    window.onload = () => {
      renderRubricTable();
      updateTimerDisplay();
    };
  </script>
</body>
</html>
