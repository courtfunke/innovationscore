<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLL Innovation Project Rubric & Evaluator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-red {
            0%, 100% { background-color: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.5); }
            50% { background-color: rgba(239, 68, 68, 0.25); border-color: rgba(239, 68, 68, 0.9); }
        }
        .timer-warning {
            animation: pulse-red 1.5s infinite;
        }

        /* Print Stylesheet */
        @media print {
            body {
                background: white !important;
                color: black !important;
                font-size: 12pt;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .shadow-lg, .shadow-md, .shadow-sm {
                box-shadow: none !important;
            }
            .border {
                border-color: #000 !important;
            }
            .rubric-card {
                break-inside: avoid;
                page-break-inside: avoid;
                border: 1px solid #ccc !important;
                margin-bottom: 1rem !important;
            }
            input, select, textarea {
                border: none !important;
                background: transparent !important;
            }
        }

        @media screen {
            .print-only {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

    <!-- Header & App Controls -->
    <header class="bg-slate-900 text-white shadow-md no-print">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <span class="bg-red-600 text-white text-xs font-bold px-2 py-0.5 rounded tracking-wider uppercase">FIRST® LEGO® League</span>
                <h1 class="text-2xl font-black tracking-tight mt-1">Innovation Project Rubric</h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium px-3 py-2 rounded border border-slate-700 transition flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Print / Save PDF
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-6">

        <!-- Standalone 5-Minute Timer Module -->
        <section class="bg-slate-800 text-white rounded-xl shadow-lg p-5 mb-8 border border-slate-700 no-print" id="timer-card">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="text-center md:text-left">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Presentation Timer</h2>
                    <div id="timer-display" class="text-5xl font-mono font-bold tracking-wider text-cyan-400 mt-1">05:00</div>
                </div>

                <div class="flex flex-wrap items-center justify-center gap-2">
                    <button id="btn-start" onclick="toggleTimer()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-2.5 rounded-lg transition flex items-center gap-2 shadow">
                        <svg id="play-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.333-5.89a1.5 1.5 0 000-2.538L6.3 2.841z"></path></svg>
                        <span id="btn-start-label">Start</span>
                    </button>
                    <button onclick="resetTimer()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold px-4 py-2.5 rounded-lg transition">
                        Reset
                    </button>
                    
                    <div class="h-8 w-px bg-slate-700 mx-1 hidden sm:block"></div>

                    <div class="flex items-center gap-1">
                        <button onclick="setPreset(300)" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded font-mono text-slate-300">5:00</button>
                        <button onclick="setPreset(180)" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded font-mono text-slate-300">3:00</button>
                        <button onclick="setPreset(600)" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded font-mono text-slate-300">10:00</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Evaluation Form -->
        <form id="rubric-form" onsubmit="handleFormSubmit(event)" class="space-y-6">

            <!-- Team Details Header Card -->
            <div class="bg-white rounded-xl shadow-md p-6 border border-slate-200">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Team #</label>
                        <input type="text" id="team-number" required placeholder="e.g. 12345" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Team Name</label>
                        <input type="text" id="team-name" required placeholder="e.g. RoboBuilders" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Judging Room</label>
                        <input type="text" id="judging-room" placeholder="e.g. Room B" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- Printable Header Title -->
            <div class="print-only text-center mb-4 border-b pb-4">
                <h1 class="text-2xl font-bold">FIRST® LEGO® League - Innovation Project Rubric</h1>
                <p id="print-team-info" class="text-lg font-medium mt-1"></p>
            </div>

            <!-- Rubric Criteria Container -->
            <div id="rubric-criteria" class="space-y-6"></div>

            <!-- Submit & Action Bar -->
            <div class="bg-white rounded-xl shadow-md p-6 border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4 no-print">
                <div>
                    <div class="text-sm font-bold text-slate-500 uppercase">Total Calculated Score</div>
                    <div id="total-score-display" class="text-3xl font-black text-slate-800">0 / 20 <span class="text-lg font-normal text-slate-500">(0%)</span></div>
                </div>
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <button type="button" onclick="resetForm()" class="w-1/2 sm:w-auto px-4 py-2.5 border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50 font-medium transition">
                        Clear Form
                    </button>
                    <button type="submit" class="w-1/2 sm:w-auto px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow transition flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                        Submit & Print PDF
                    </button>
                </div>
            </div>

        </form>
    </main>

    <script>
        const rubricData = [
            {
                id: "identify",
                category: "IDENTIFY",
                title: "Team had a clearly defined problem that was well researched.",
                levels: [
                    "Unclear definition of the problem",
                    "Partially clear definition of the problem",
                    "Clear definition of the problem",
                    "Minimal evidence of research",
                    "Partial evidence of research from one or more sources",
                    "Clear, detailed research from a variety of sources"
                ]
            },
            {
                id: "design",
                category: "DESIGN",
                title: "Team worked together while creating a project plan and developing their ideas.",
                levels: [
                    "Minimal evidence of an effective project plan",
                    "Partial evidence of an effective project plan",
                    "Clear evidence of an effective project plan",
                    "Minimal evidence that development process involved all team members",
                    "Partial evidence that development process involved all team members",
                    "Clear evidence that development process involved all team members"
                ]
            },
            {
                id: "create",
                category: "CREATE",
                title: "Team developed an original idea or built on an existing one with a prototype model/drawing to represent their solution.",
                levels: [
                    "Minimal explanation of innovation in solution",
                    "Simple explanation of innovation in solution",
                    "Detailed explanation of innovation in solution",
                    "Unclear model/drawing that represents the solution",
                    "Simple model/drawing that represents the solution",
                    "Detailed model/drawing that represents the solution"
                ]
            },
            {
                id: "iterate",
                category: "ITERATE",
                title: "Team shared their ideas with others, collected feedback, and included improvements to their solution.",
                levels: [
                    "Minimal sharing of their solution with others",
                    "Solution shared with at least one person/group",
                    "Solution shared with multiple people/groups",
                    "Minimal evidence of improvements based on feedback",
                    "Partial evidence of improvements based on feedback",
                    "Clear evidence of improvements based on feedback"
                ]
            },
            {
                id: "communicate",
                category: "COMMUNICATE",
                title: "Team shared an effective presentation of their solution, its impact on others, and celebrated their team's progress.",
                levels: [
                    "Unclear explanation of solution and its potential impact on others",
                    "Partially clear explanation of solution and its potential impact on others",
                    "Clear explanation of solution and its potential impact on others",
                    "Presentation shows minimal pride or enthusiasm for their work",
                    "Presentation shows partial pride or enthusiasm for their work",
                    "Presentation clearly shows pride or enthusiasm for their work"
                ]
            }
        ];

        function renderRubric() {
            const container = document.getElementById("rubric-criteria");
            container.innerHTML = "";

            rubricData.forEach((item, index) => {
                const card = document.createElement("div");
                card.className = "bg-white rounded-xl shadow-md p-6 border border-slate-200 rubric-card";
                
                card.innerHTML = `
                    <div class="border-b border-slate-200 pb-3 mb-4">
                        <span class="text-xs font-black text-blue-600 tracking-wider uppercase">Criterion ${index + 1}</span>
                        <h3 class="text-xl font-bold text-slate-800">${item.category}</h3>
                        <p class="text-sm text-slate-600 mt-0.5">${item.title}</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
                        <label class="border border-slate-200 rounded-lg p-3 cursor-pointer hover:border-blue-400 transition flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-xs font-bold bg-slate-100 text-slate-700 px-2 py-0.5 rounded">1 - Beginning</span>
                                    <input type="radio" name="${item.id}" value="1" onchange="calculateScore()" class="w-4 h-4 text-blue-600">
                                </div>
                                <ul class="text-xs text-slate-600 space-y-1.5 list-disc pl-4">
                                    <li>${item.levels[0]}</li>
                                    <li>${item.levels[3]}</li>
                                </ul>
                            </div>
                        </label>

                        <label class="border border-slate-200 rounded-lg p-3 cursor-pointer hover:border-blue-400 transition flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-xs font-bold bg-blue-50 text-blue-700 px-2 py-0.5 rounded">2 - Developing</span>
                                    <input type="radio" name="${item.id}" value="2" onchange="calculateScore()" class="w-4 h-4 text-blue-600">
                                </div>
                                <ul class="text-xs text-slate-600 space-y-1.5 list-disc pl-4">
                                    <li>${item.levels[1]}</li>
                                    <li>${item.levels[4]}</li>
                                </ul>
                            </div>
                        </label>

                        <label class="border border-slate-200 rounded-lg p-3 cursor-pointer hover:border-blue-400 transition flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-xs font-bold bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded">3 - Accomplished</span>
                                    <input type="radio" name="${item.id}" value="3" onchange="calculateScore()" class="w-4 h-4 text-blue-600">
                                </div>
                                <ul class="text-xs text-slate-600 space-y-1.5 list-disc pl-4">
                                    <li>${item.levels[2]}</li>
                                    <li>${item.levels[5]}</li>
                                </ul>
                            </div>
                        </label>

                        <label class="border border-slate-200 rounded-lg p-3 cursor-pointer hover:border-blue-400 transition flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-xs font-bold bg-purple-50 text-purple-700 px-2 py-0.5 rounded">4 - Exceeds</span>
                                    <input type="radio" name="${item.id}" value="4" onchange="calculateScore()" class="w-4 h-4 text-blue-600">
                                </div>
                                <p class="text-xs text-slate-600 italic">Exceeds standard expectations for this age group.</p>
                            </div>
                        </label>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">How has the team exceeded? (Required if Level 4 is selected)</label>
                        <textarea id="exceeds-${item.id}" rows="2" placeholder="Provide specific feedback on how the team exceeded expectations..." class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function calculateScore() {
            let total = 0;
            rubricData.forEach(item => {
                const selected = document.querySelector(`input[name="${item.id}"]:checked`);
                if (selected) {
                    total += parseInt(selected.value, 10);
                }
            });

            const max = rubricData.length * 4;
            const percentage = Math.round((total / max) * 100);
            document.getElementById("total-score-display").innerHTML = `${total} / ${max} <span class="text-lg font-normal text-slate-500">(${percentage}%)</span>`;
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            const teamNum = document.getElementById("team-number").value;
            const teamName = document.getElementById("team-name").value;
            const room = document.getElementById("judging-room").value;

            document.getElementById("print-team-info").innerText = `Team #${teamNum} - ${teamName} | Room: ${room || 'N/A'}`;

            window.print();
        }

        function resetForm() {
            if (confirm("Are you sure you want to clear all scores and details?")) {
                document.getElementById("rubric-form").reset();
                calculateScore();
            }
        }

        // --- 5-Minute Timer Logic ---
        let timerSeconds = 300;
        let timerInterval = null;
        let isRunning = false;

        function updateTimerDisplay() {
            const minutes = Math.floor(timerSeconds / 60);
            const seconds = timerSeconds % 60;
            const formatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            document.getElementById("timer-display").innerText = formatted;

            const card = document.getElementById("timer-card");
            if (timerSeconds <= 60 && timerSeconds > 0) {
                card.classList.add("timer-warning");
            } else {
                card.classList.remove("timer-warning");
            }
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (timerSeconds <= 0) return;
            isRunning = true;
            document.getElementById("btn-start-label").innerText = "Pause";
            document.getElementById("play-icon").innerHTML = '<path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path>';

            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerDisplay();

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    playAudioAlert();
                    alert("Time's Up!");
                    document.getElementById("btn-start-label").innerText = "Start";
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            document.getElementById("btn-start-label").innerText = "Start";
            document.getElementById("play-icon").innerHTML = '<path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.333-5.89a1.5 1.5 0 000-2.538L6.3 2.841z"></path>';
        }

        function resetTimer() {
            pauseTimer();
            timerSeconds = 300;
            updateTimerDisplay();
        }

        function setPreset(seconds) {
            pauseTimer();
            timerSeconds = seconds;
            updateTimerDisplay();
        }

        function playAudioAlert() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = "sine";
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.setValueAtTime(1200, now + 0.2);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + 0.8);
            } catch (e) {
                console.log("Audio play blocked or unsupported:", e);
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            renderRubric();
            updateTimerDisplay();
        });
    </script>
</body>
</html>
